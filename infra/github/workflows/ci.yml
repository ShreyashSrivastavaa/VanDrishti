name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: forestwatch
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: forestwatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Run Node Tests
        run: npm test
        env:
          DATABASE_URL: postgres://forestwatch:testpassword@localhost:5432/forestwatch_test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ml/requirements.txt
          pip install pytest pytest-cov ruff

      - name: Lint Python with Ruff
        run: ruff check services/ml/

      - name: Run Python Tests
        run: pytest services/ml/tests -v
