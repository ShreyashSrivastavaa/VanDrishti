[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forestwatch-ml"
version = "0.1.0"
description = "Geospatial preprocessing, change detection and machine learning pipeline for ForestWatch AI"
authors = [{ name = "ForestWatch AI Contributors" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-image>=0.22.0",
    "shapely>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "psycopg2-binary>=2.9.9",
    "torch>=2.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
